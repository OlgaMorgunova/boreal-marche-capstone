name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests · data quality · assistant eval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BOREAL_EMBEDDER: hash        # no model download in CI (retrieval quality: assistant_eval.json)
      BOREAL_MONITOR_LOOP: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (Python 3.11)
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -e ".[train,dev]"
      - name: Ruff (lint + format)
        run: make lint
      - name: Mypy
        run: make typecheck
      - name: Tests with coverage gate (unit, API contract, golden prediction, monitoring, assistant)
        run: make cov
      - name: Data-quality suite (synthetic fixtures; real-data checks run locally via `make dq`)
        run: .venv/bin/python -m pytest tests/test_data_quality.py tests/test_cleaning.py tests/test_features.py -q
      - name: Assistant evaluation — tool choice on the 40-question golden set
        run: .venv/bin/python -m pytest tests/test_assistant.py -q -k "golden"

  docker:
    name: docker build · size · container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f docker/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t boreal-api:${{ github.sha }} .
      - name: Build interface image
        run: docker build -f docker/frontend.Dockerfile -t boreal-ui:${{ github.sha }} .
      - name: Report image sizes
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '${{ github.sha }}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the API container and smoke-test it (non-root, healthcheck, contract)
        run: |
          docker run -d --name api -p 8000:8000 boreal-api:${{ github.sha }}
          docker exec api id -u | grep -qx 10001
          python3 scripts/smoke_test.py --api http://127.0.0.1:8000 --expect-sha ${{ github.sha }} --wait-seconds 120
          docker inspect --format '{{.State.Health.Status}}' api
      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -50 || true

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
