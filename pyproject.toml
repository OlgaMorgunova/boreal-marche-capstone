[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boreal-marche-capstone"
version = "0.9.5"
description = "Boréal Marché customer intelligence platform — AI Development Project Capstone"
authors = [{ name = "Olga Morgunova" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.3",
    "pyarrow>=16",
    "openpyxl>=3.1,<4",
    "pyyaml>=6,<7",
    "scipy>=1.13",
    "scikit-learn>=1.6,<1.8",
    "lightgbm>=4.3,<5",
    "xgboost>=2.1,<4",
    "joblib>=1.4",
    "pydantic>=2.8,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # D4 serving: prediction log, metrics, assistant retrieval (ONNX embeddings, no torch), tools.
    "sqlalchemy>=2.0,<2.1",   # mlflow 2.x is incompatible with SQLAlchemy 2.1
    "prometheus-client>=0.20,<1",
    "fastembed>=0.5,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Offline training / mining stack (not needed by the serving image).
train = [
    "optuna>=4,<6",
    "mlflow>=2.16,<3",
    "mlxtend>=0.23,<0.24",
    "matplotlib>=3.8,<4",
    "dvc>=3.50,<4",
]
# Cloud SDKs — only for whoever launches a managed HPO job (python -m boreal_marche.cloud).
cloud-aws = [
    "sagemaker>=2.220,<3",
    "boto3>=1.34",
]
cloud-azure = [
    "azure-ai-ml>=1.15",
    "azure-identity>=1.15",
]
# Narrative notebook (notebooks/01_project_walkthrough.ipynb).
notebook = [
    "jupyterlab>=4,<5",
    "ipykernel>=6",
    "nbconvert>=7",
    "nbformat>=5",
]
# Streamlit interface (frontend/app.py).
frontend = [
    "streamlit>=1.40,<2",
    "altair>=5,<7",
    "httpx>=0.27,<1",
]
# Traffic simulation / load test (loadtest/locustfile.py).
loadtest = ["locust>=2.30,<3"]
# Postgres driver for the Compose stack's prediction log.
postgres = ["psycopg[binary]>=3.2,<4"]
report = [
    "markdown>=3.6,<4",
    "pypdf>=4",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.8,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "data: needs the real dataset in data/ (skipped when absent, e.g. in CI)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["boreal_marche"]
omit = [
    "src/boreal_marche/reporting/*",
    "src/boreal_marche/retention/sm_train.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# doc/ holds the instructor's course material (notebooks, the Locust example), not project code.
extend-exclude = ["doc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "S301"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# Narrative notebooks: long display/print lines are fine; subprocess is the documented pipeline call.
"notebooks/*" = ["E501", "E402", "S603", "S607"]
# Slide text is content, not logic.
"scripts/build_slides.py" = ["E501"]
# UI copy and widget calls: long string literals read better unwrapped.
"frontend/*" = ["E501"]
# Load-test traffic: random choices are simulation, not security; docstring holds CLI examples.
"loadtest/*" = ["E501", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
warn_return_any = false
disallow_any_generics = false
warn_unused_ignores = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# matplotlib's stubs do not accept pandas Timestamps on date axes (valid at runtime).
module = ["boreal_marche.reporting.figures", "boreal_marche.reporting.style"]
disable_error_code = ["arg-type", "attr-defined"]

[[tool.mypy.overrides]]
# The SageMaker SDK (optional extra) re-exports names mypy cannot see; treat it as untyped.
module = ["sagemaker", "sagemaker.*"]
follow_imports = "skip"

[tool.setuptools.packages.find]
where = ["src"]
