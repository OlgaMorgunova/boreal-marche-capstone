[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boreal-marche-capstone"
version = "0.3.0"
description = "Boréal Marché customer intelligence platform — AI Development Project Capstone"
authors = [{ name = "Olga Morgunova" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.3",
    "pyarrow>=16",
    "openpyxl>=3.1,<4",
    "pyyaml>=6,<7",
    "scipy>=1.13",
    "scikit-learn>=1.6,<1.8",
    "lightgbm>=4.3,<5",
    "xgboost>=2.1,<4",
    "joblib>=1.4",
    "pydantic>=2.8,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Offline training / mining stack (not needed by the serving image).
train = [
    "optuna>=4,<6",
    "mlflow>=2.16,<3",
    "sqlalchemy>=2.0,<2.1",   # mlflow 2.x is incompatible with SQLAlchemy 2.1
    "mlxtend>=0.23,<0.24",
    "matplotlib>=3.8,<4",
    "dvc>=3.50,<4",
]
# Cloud SDKs — only for whoever launches a managed HPO job (python -m boreal_marche.cloud).
cloud-aws = [
    "sagemaker>=2.220,<3",
    "boto3>=1.34",
]
cloud-azure = [
    "azure-ai-ml>=1.15",
    "azure-identity>=1.15",
]
report = [
    "markdown>=3.6,<4",
    "pypdf>=4",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.8,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "data: needs the real dataset in data/ (skipped when absent, e.g. in CI)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["boreal_marche"]
omit = [
    "src/boreal_marche/reporting/*",
    "src/boreal_marche/retention/sm_train.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "S301"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
warn_return_any = false
disallow_any_generics = false
warn_unused_ignores = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# matplotlib's stubs do not accept pandas Timestamps on date axes (valid at runtime).
module = ["boreal_marche.reporting.figures", "boreal_marche.reporting.style"]
disable_error_code = ["arg-type", "attr-defined"]

[tool.setuptools.packages.find]
where = ["src"]
